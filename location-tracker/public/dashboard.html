<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard Lokasi</title>
  <style>
    body { font-family: Arial,sans-serif; margin:30px; background:#f5f5f5; }
    h1 { margin-bottom:20px; }
    table { width:100%; border-collapse:collapse; background:white; }
    th,td { padding:12px; border:1px solid #ddd; text-align:left; }
    th { background:#222; color:white; }
    .empty { text-align:center; padding:30px; }
  </style>
</head>
<body>
  <h1>Dashboard Data Lokasi</h1>
  <table>
    <thead>
      <tr>
        <th>Waktu</th><th>Platform</th><th>Browser</th><th>Baterai</th>
        <th>Latitude</th><th>Longitude</th><th>Akurasi</th>
      </tr>
    </thead>
    <tbody id="data">
      <tr><td colspan="7" class="empty">Memuat data...</td></tr>
    </tbody>
  </table>

  <script>
    async function loadData() {
      const response = await fetch("/api/locations");
      const locations = await response.json();
      const tbody = document.getElementById("data");
      tbody.innerHTML = "";

      if (!locations.length) {
        tbody.innerHTML = '<tr><td colspan="7" class="empty">Belum ada data.</td></tr>';
        return;
      }

      locations.slice().reverse().forEach(item => {
        const row = document.createElement("tr");
        row.innerHTML = `
          <td>${new Date(item.timestamp).toLocaleString()}</td>
          <td>${item.platform}</td>
          <td>${item.browser}</td>
          <td>${item.battery !== null ? item.battery + "%" : "Tidak tersedia"}</td>
          <td>${item.latitude}</td>
          <td>${item.longitude}</td>
          <td>${item.accuracy ? Math.round(item.accuracy) + " m" : "Tidak tersedia"}</td>
        `;
        tbody.appendChild(row);
      });
    }
    loadData();
    setInterval(loadData, 5000);
  </script>
</body>
</html>
